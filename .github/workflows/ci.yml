name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      # Prepared workloads and anchored volumes require this reviewed API tree.
      - name: Checkout matching API contract
        uses: actions/checkout@v4
        with:
          repository: spk-ai/api
          ref: ce64da8680c39a13f7174c3146b38f3bfcc03037
          path: .ci-api
          persist-credentials: false

      - name: Generate protobuf bindings
        run: buf generate .ci-api --include-imports

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...
