name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      k8s_runner_ref:
        description: k8s-runner ref to deploy from.
        required: false
        default: c0231bbfaf2260d03267e8da3b66181fdb1895d0
      agents_ref:
        description: Agents ref to deploy from.
        required: false
        default: df88f90f6aee77647912e7336e03d43545a2a6a4
      authorization_ref:
        description: Authorization ref to deploy from.
        required: false
        default: 30581ca4f834ad8a0a63e14bd0f465333b3929e9
      runners_ref:
        description: Runners ref to deploy from.
        required: false
        default: 0417696d580004e830d4b4bddf74fd0c44b367ed
      identity_ref:
        description: Identity ref to deploy from.
        required: false
        default: 47aaabc67acfad0b80ca97d5e1b27f96b670f27f
      threads_ref:
        description: Threads ref to deploy from.
        required: false
        default: 066fe51e57343b130b38af09d061a6540e0e8e20
      agynd_cli_ref:
        description: agynd-cli ref to build workload daemon from.
        required: false
        default: 495920a92cc359e0693e8710f11469240bd5a770
      expose_ref:
        description: Expose ref to deploy from.
        required: false
        default: da7ef4ffd81fcd829dba6e35c6467e958e209df5
      gateway_ref:
        description: Gateway ref to deploy from.
        required: false
        default: 45171b64043510f2df643ba7b9938800733a98e7
      llm_proxy_ref:
        description: llm-proxy ref to deploy from.
        required: false
        default: 212b0a8b90c377cc76ca00c389434921270b572a

# Init images are resolved to the newest published release by the run-tests
# action. Pinning one here opts this workflow out of every fix shipped after it.
env:
  K8S_RUNNER_REF: c0231bbfaf2260d03267e8da3b66181fdb1895d0
  AGENTS_REF: df88f90f6aee77647912e7336e03d43545a2a6a4
  AUTHORIZATION_REF: 30581ca4f834ad8a0a63e14bd0f465333b3929e9
  RUNNERS_REF: 0417696d580004e830d4b4bddf74fd0c44b367ed
  IDENTITY_REF: 47aaabc67acfad0b80ca97d5e1b27f96b670f27f
  THREADS_REF: 066fe51e57343b130b38af09d061a6540e0e8e20
  AGYND_CLI_REF: 495920a92cc359e0693e8710f11469240bd5a770
  EXPOSE_REF: da7ef4ffd81fcd829dba6e35c6467e958e209df5
  GATEWAY_REF: b80912e71996acdc7a3234e98ce4710c267a6284
  LLM_PROXY_REF: 212b0a8b90c377cc76ca00c389434921270b572a

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.network }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # tproxy is the upstream task network (NET_ADMIN tunneler, runner profile
    # "none" with NET_ADMIN allowlisted) and runs every suite. explicit-proxy
    # is the unprivileged workload-proxy under restricted Pod Security on an
    # overlay-only NetworkPolicy; it runs real agent turns (agn and codex), a
    # direct NET_ADMIN refusal and the live Pod/network negatives. MCP servers
    # that install from public registries need egress rules there, so
    # TestMCPToolsE2E and the full suites stay on the tproxy leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - network: tproxy
            runner_pod_security: "WORKLOAD_POD_SECURITY=none WORKLOAD_ALLOWED_CAPABILITIES=NET_ADMIN"
            focused: "TestAgentAgynCLIWaitToAnotherAgent|TestMCPToolsE2E|TestWorkloadStartRetryPolicyFastRetry"
          - network: explicit-proxy
            runner_pod_security: "WORKLOAD_POD_SECURITY=restricted WORKLOAD_ALLOWED_CAPABILITIES="
            focused: "TestAgentAgynCLIWaitToAnotherAgent|TestWorkloadStartRetryPolicyFastRetry|TestRestrictedRunnerRefusesNetAdmin|TestRestrictedTaskPodAnswersAndHolds"
    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Checkout pinned E2E tooling
        uses: actions/checkout@v4
        with:
          repository: agynio/e2e
          ref: 435b549a937129b6858e7314648eb690894209fe
          path: .e2e-tooling
          persist-credentials: false

      - name: Prepare disposable VM image repair and diagnostics
        run: python3 .github/e2e/prepare.py .e2e-tooling

      - name: Provision cluster
        uses: ./.e2e-tooling/.github/actions/provision-vm
        with:
          agyn-cli-version: v0.19.0

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@435b549a937129b6858e7314648eb690894209fe

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Checkout agynd-cli
        uses: actions/checkout@v4
        with:
          repository: agynio/agynd-cli
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.agynd_cli_ref || env.AGYND_CLI_REF }}
          path: .e2e-deps/agynd-cli

      - name: Setup Go for agynd-cli
        uses: actions/setup-go@v6
        with:
          go-version-file: .e2e-deps/agynd-cli/go.mod

      # The base init images are not pinned: pinning opts this workflow out of
      # every fix shipped in a later image. run-tests resolves them, but that
      # runs after this build step, so resolve them here too.
      - name: Resolve base init images
        run: |-
          set -euo pipefail
          latest_image() {
            repo="$1"
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:agynio/${repo}:pull" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            url="https://ghcr.io/v2/agynio/${repo}/tags/list?n=1000"
            tags=""
            while [ -n "$url" ]; do
              page="$(curl -fsS -D /tmp/hdr.$$ -H "Authorization: Bearer ${token}" "$url")"
              tags="${tags}$(printf '%s' "$page" |
                python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin).get("tags") or []))')
          "
              next="$(sed -n 's/^[Ll]ink:.*<\([^>]*\)>.*/\1/p' /tmp/hdr.$$)"
              rm -f /tmp/hdr.$$
              [ -n "$next" ] && url="https://ghcr.io${next}" || url=""
            done
            latest="$(printf '%s\n' "$tags" | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } |
              sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
            [ -n "$latest" ] || { echo "No semver tags for ghcr.io/agynio/${repo}." >&2; return 1; }
            printf 'ghcr.io/agynio/%s:%s' "$repo" "$latest"
          }
          codex="$(latest_image agent-init-codex)"
          agn="$(latest_image agent-init-agn)"
          claude="$(latest_image agent-init-claude)"
          {
            echo "CODEX_INIT_IMAGE=$codex"
            echo "AGYN_AGENT_INIT_IMAGE=$codex"
            echo "AGN_INIT_IMAGE=$agn"
            echo "AGN_EXPOSE_INIT_IMAGE=$agn"
            echo "CLAUDE_INIT_IMAGE=$claude"
          } >> "$GITHUB_ENV"
          echo "base init images: codex=$codex agn=$agn claude=$claude"

      - name: Build agent init images
        working-directory: .e2e-deps/agynd-cli
        run: |-
          set -euo pipefail
          buf generate https://github.com/spk-ai/api.git#ref=ce64da8680c39a13f7174c3146b38f3bfcc03037,subdir=proto
          mkdir -p .build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o .build/agynd ./cmd/agynd

          build_context="${GITHUB_WORKSPACE}/.e2e-deps/agent-init-instance-inbox"
          mkdir -p "${build_context}"
          cp .build/agynd "${build_context}/agynd"
          cat >"${build_context}/agn-wrapper" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          exec "$(dirname "$0")/agn.real" "$@"
          EOF
          chmod +x "${build_context}/agn-wrapper"
          cat >"${build_context}/agyn-wrapper" <<'EOF'
          #!/usr/bin/env sh
          set -eu
          if [ -n "${AGENT_INSTANCE_ID:-}" ]; then
            export AGYN_IDENTITY_ID="${AGENT_INSTANCE_ID}"
          fi
          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          set +e
          "$(dirname "$0")/agyn.real" "$@" >"${stdout_file}" 2>"${stderr_file}"
          status="$?"
          set -e
          cat "${stdout_file}"
          awk '!/^thread_id:/' "${stderr_file}" >&2
          rm -f "${stdout_file}" "${stderr_file}"
          exit "${status}"
          EOF
          chmod +x "${build_context}/agyn-wrapper"
          cat >"${build_context}/Dockerfile" <<'EOF'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          COPY agynd /tools/agynd
          COPY agn-wrapper /tmp/agyn-agn-wrapper
          COPY agyn-wrapper /tmp/agyn-agyn-wrapper
          RUN agn_dir="" \
              && for agn_path in "$(command -v agn 2>/dev/null || true)" /tools/agn /tools/cli/agn /agyn-bin/agn /agyn-bin/cli/agn; do \
                if [ -n "${agn_path}" ] && [ -x "${agn_path}" ]; then \
                  agn_dir="$(dirname "${agn_path}")"; \
                  mv "${agn_path}" "${agn_dir}/agn.real"; \
                  cp /tmp/agyn-agn-wrapper "${agn_dir}/agn"; \
                  chmod +x "${agn_dir}/agn"; \
                  break; \
                fi; \
              done \
              && agyn_installed="" \
              && for agyn_path in "$(command -v agyn 2>/dev/null || true)" /tools/cli/agyn /tools/agyn /agyn-bin/cli/agyn /agyn-bin/agyn; do \
                if [ -n "${agyn_path}" ] && { [ -e "${agyn_path}" ] || [ -L "${agyn_path}" ]; }; then \
                  agyn_dir="$(dirname "${agyn_path}")"; \
                  mv "${agyn_path}" "${agyn_dir}/agyn.real"; \
                  cp /tmp/agyn-agyn-wrapper "${agyn_dir}/agyn"; \
                  chmod +x "${agyn_dir}/agyn"; \
                  agyn_installed="true"; \
                  break; \
                fi; \
              done \
              && if [ -z "${agyn_installed}" ] && [ -n "${agn_dir}" ]; then \
                cp /tmp/agyn-agyn-wrapper "${agn_dir}/agyn"; \
                chmod +x "${agn_dir}/agyn"; \
              fi
          EOF
          codex_image="e2e/agent-init-codex:instance-inbox"
          agn_image="e2e/agent-init-agn:instance-inbox"
          claude_image="e2e/agent-init-claude:instance-inbox"
          docker build --build-arg BASE_IMAGE="${CODEX_INIT_IMAGE}" -t "${codex_image}" "${build_context}"
          docker build --build-arg BASE_IMAGE="${AGN_INIT_IMAGE}" -t "${agn_image}" "${build_context}"
          docker build --build-arg BASE_IMAGE="${CLAUDE_INIT_IMAGE}" -t "${claude_image}" "${build_context}"
          # k3s, not k3d: the platform VM has no registry mirror, so the
          # cluster is handed the images the host just built.
          agyn local load-image "${codex_image}" "${agn_image}" "${claude_image}"
          {
          echo "CODEX_INIT_IMAGE=${codex_image}"
          echo "AGYN_AGENT_INIT_IMAGE=${codex_image}"
          echo "E2E_AGENT_INIT_IMAGE=${codex_image}"
          echo "AGN_INIT_IMAGE=${agn_image}"
          echo "AGN_EXPOSE_INIT_IMAGE=${agn_image}"
          echo "CLAUDE_INIT_IMAGE=${claude_image}"
          } >> "${GITHUB_ENV}"


      - name: Checkout authorization
        uses: actions/checkout@v4
        with:
          repository: agynio/authorization
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.authorization_ref || env.AUTHORIZATION_REF }}
          path: .e2e-deps/authorization

      - name: Apply authorization model from source
        working-directory: .e2e-deps/authorization
        run: |-
          set -euo pipefail
          dump_authorization_model_diagnostics() {
            echo "== authorization model diagnostics ==" >&2
            kubectl get secret authorization-openfga -n agyn-platform -o name >&2 || true
            kubectl get application authorization -n argocd -o yaml >&2 || true
            kubectl get deployment authorization -n agyn-platform -o yaml >&2 || true
            kubectl get svc -A -o wide | grep -i openfga >&2 || true
            kubectl get pods -n agyn-platform -l app.kubernetes.io/name=authorization -o wide >&2 || true
            kubectl logs -n agyn-platform -l app.kubernetes.io/name=authorization --all-containers --tail=300 >&2 || true
            kubectl get events -n agyn-platform --sort-by=.metadata.creationTimestamp >&2 || true
          }
          trap dump_authorization_model_diagnostics ERR
          secret_name="authorization-openfga"
          authorization_application="authorization"
          if kubectl get application "${authorization_application}" -n argocd >/dev/null 2>&1; then
            kubectl patch application "${authorization_application}" -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}'
          fi
          openfga_namespace="agyn-platform"
          openfga_service="$(kubectl get svc -n "${openfga_namespace}" -l app.kubernetes.io/name=openfga -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "${openfga_service}" ] && kubectl get svc openfga -n "${openfga_namespace}" >/dev/null 2>&1; then
            openfga_service="openfga"
          fi
          if [ -z "${openfga_service}" ]; then
            openfga_ref="$(kubectl get svc -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.metadata.name}{"\n"}{end}' | awk '!found && tolower($2) ~ /openfga/ { print; found=1 }')"
            if [ -n "${openfga_ref}" ]; then
              openfga_namespace="$(printf '%s' "${openfga_ref}" | awk '{ print $1 }')"
              openfga_service="$(printf '%s' "${openfga_ref}" | awk '{ print $2 }')"
            fi
          fi
          if [ -z "${openfga_service}" ]; then
            echo "OpenFGA service not found" >&2
            kubectl get svc -A -o wide >&2 || true
            exit 1
          fi
          openfga_port="$(kubectl get svc "${openfga_service}" -n "${openfga_namespace}" -o jsonpath='{.spec.ports[?(@.name=="http")].port}' 2>/dev/null || true)"
          if [ -z "${openfga_port}" ]; then
            openfga_port="$(kubectl get svc "${openfga_service}" -n "${openfga_namespace}" -o jsonpath='{.spec.ports[0].port}')"
          fi
          kubectl port-forward -n "${openfga_namespace}" "svc/${openfga_service}" 18080:"${openfga_port}" >/tmp/openfga-port-forward.log 2>&1 &
          port_forward_pid="$!"
          cleanup() {
            kill "${port_forward_pid}" >/dev/null 2>&1 || true
            wait "${port_forward_pid}" >/dev/null 2>&1 || true
          }
          trap 'dump_authorization_model_diagnostics; cleanup' ERR
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:18080/healthz" >/dev/null 2>&1 || curl -fsS "http://127.0.0.1:18080/stores" >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "${port_forward_pid}" >/dev/null 2>&1; then
              cat /tmp/openfga-port-forward.log >&2 || true
              exit 1
            fi
            if [ "${i}" -eq 60 ]; then
              cat /tmp/openfga-port-forward.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          store_id="$(curl -fsS "http://127.0.0.1:18080/stores" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("stores") or [{}])[0].get("id",""))')"
          if [ -z "${store_id}" ]; then
            echo "OpenFGA reported no authorization store" >&2
            curl -fsS "http://127.0.0.1:18080/stores" >&2 || true
            exit 1
          fi
          echo "openfga store: ${store_id}"
          apply_file="$(mktemp apply-authorization-model-XXXX.go)"
          trap 'rm -f "${apply_file}"; cleanup' EXIT
          cat >"${apply_file}" <<'GO'
          package main

          import (
            "context"
            "encoding/json"
            "fmt"
            "os"
            "strings"
            "time"

            "github.com/agynio/authorization/internal/authz"
            openfgaclient "github.com/openfga/go-sdk/client"
            "github.com/openfga/language/pkg/go/transformer"
          )

          func main() {
            apiURL := strings.TrimSpace(os.Getenv("OPENFGA_API_URL"))
            storeID := strings.TrimSpace(os.Getenv("OPENFGA_STORE_ID"))
            if apiURL == "" || storeID == "" {
              panic("OPENFGA_API_URL and OPENFGA_STORE_ID are required")
            }
            ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
            defer cancel()
            client, err := openfgaclient.NewSdkClient(&openfgaclient.ClientConfiguration{ApiUrl: apiURL})
            if err != nil {
              panic(err)
            }
            if err := client.SetStoreId(storeID); err != nil {
              panic(err)
            }
            modelJSON, err := transformer.TransformDSLToJSON(authz.ModelDSL)
            if err != nil {
              panic(err)
            }
            var body openfgaclient.ClientWriteAuthorizationModelRequest
            if err := json.Unmarshal([]byte(modelJSON), &body); err != nil {
              panic(err)
            }
            written, err := client.WriteAuthorizationModel(ctx).Body(body).Execute()
            if err != nil {
              panic(err)
            }
            modelID := strings.TrimSpace(written.GetAuthorizationModelId())
            if modelID == "" {
              panic("authorization model id missing")
            }
            fmt.Println(modelID)
          }
          GO
          model_id="$(OPENFGA_API_URL=http://127.0.0.1:18080 OPENFGA_STORE_ID="${store_id}" go run "${apply_file}")"
          if [ -z "${model_id}" ]; then
            echo "authorization model id missing" >&2
            exit 1
          fi
          kubectl create secret generic "${secret_name}" -n agyn-platform \
            --from-literal=OPENFGA_STORE_ID="${store_id}" \
            --from-literal=OPENFGA_MODEL_ID="${model_id}" \
            --dry-run=client -o yaml | kubectl apply -f -
          authorization_deployment="$(kubectl get deployment -n agyn-platform -l app.kubernetes.io/name=authorization -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "${authorization_deployment}" ]; then
            echo "authorization deployment not found" >&2
            kubectl get deployment -n agyn-platform -o wide >&2 || true
            exit 1
          fi
          kubectl patch deployment "${authorization_deployment}" -n agyn-platform --type=json -p "$(cat <<PATCH
          [{"op":"replace","path":"/spec/template/spec/containers/0/env","value":[{"name":"GRPC_ADDRESS","value":":50051"},{"name":"OPENFGA_API_URL","value":"http://${openfga_service}.${openfga_namespace}.svc.cluster.local:${openfga_port}"},{"name":"OPENFGA_STORE_ID","value":"${store_id}"},{"name":"OPENFGA_MODEL_ID","value":"${model_id}"}]}]
          PATCH
          )"
          kubectl rollout status "deployment/${authorization_deployment}" -n agyn-platform --timeout=240s
          current_model_id="$(kubectl get deployment "${authorization_deployment}" -n agyn-platform -o jsonpath='{range .spec.template.spec.containers[0].env[?(@.name=="OPENFGA_MODEL_ID")]}{.value}{end}')"
          if [ "${current_model_id}" != "${model_id}" ]; then
            echo "authorization deployment OPENFGA_MODEL_ID mismatch: expected ${model_id}, got ${current_model_id}" >&2
            exit 1
          fi
          echo "Applied authorization model ${model_id} to store ${store_id}."

      - name: Checkout agents
        uses: actions/checkout@v4
        with:
          repository: agynio/agents
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.agents_ref || env.AGENTS_REF }}
          path: .e2e-deps/agents

      - name: Deploy agents from source
        timeout-minutes: 16
        working-directory: .e2e-deps/agents
        run: |-
          set -euo pipefail
          dump_agents_source_diagnostics() {
            kubectl get pods -n agyn-platform -l app.kubernetes.io/name=agents -o wide >&2 || true
            kubectl describe pods -n agyn-platform -l app.kubernetes.io/name=agents >&2 || true
            kubectl logs -n agyn-platform -l app.kubernetes.io/name=agents --all-containers --tail=200 >&2 || true
            kubectl get events -n agyn-platform --sort-by=.metadata.creationTimestamp >&2 || true
          }
          trap dump_agents_source_diagnostics ERR
          # Pin both host generation and the container's first-sync fallback.
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('devspace.yaml')
          s = p.read_text()
          old = 'buf generate buf.build/agynio/api'
          assert s.count(old) == 1, 'pinned agents DevSpace contract changed'
          p.write_text(s.replace(old, 'buf generate https://github.com/spk-ai/api.git#ref=ce64da8680c39a13f7174c3146b38f3bfcc03037,subdir=proto'))
          PYCODE
          buf generate https://github.com/spk-ai/api.git#ref=ce64da8680c39a13f7174c3146b38f3bfcc03037,subdir=proto --path agynio/api/agents/v1 --path agynio/api/authorization/v1 --path agynio/api/identity/v1 --path agynio/api/images/v1 --path agynio/api/notifications/v1 --path agynio/api/organizations/v1
          timeout --signal=TERM --kill-after=30s 14m devspace dev

      - name: Checkout identity
        uses: actions/checkout@v4
        with:
          repository: agynio/identity
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_ref || env.IDENTITY_REF }}
          path: .e2e-deps/identity

      - name: Deploy identity from source
        working-directory: .e2e-deps/identity
        run: |-
          set -euo pipefail
          dump_identity_source_diagnostics() {
            selector="app.kubernetes.io/name=identity"
            echo "== identity source deployment diagnostics ==" >&2
            kubectl get application identity -n argocd -o yaml >&2 || true
            kubectl get deployment identity -n agyn-platform -o yaml >&2 || true
            kubectl get replicasets -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl get pods -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl describe pods -n agyn-platform -l "${selector}" >&2 || true
            echo "== identity current logs ==" >&2
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --tail=500 >&2 || true
            echo "== identity previous logs ==" >&2
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --previous --tail=500 >&2 || true
            echo "== platform events ==" >&2
            kubectl get events -n agyn-platform --sort-by=.metadata.creationTimestamp >&2 || true
          }
          trap dump_identity_source_diagnostics ERR
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('devspace.yaml')
          s = p.read_text()
          old = '  IDENTITY_NAMESPACE: platform'
          assert s.count(old) == 1, 'pinned identity namespace contract changed'
          p.write_text(s.replace(old, '  IDENTITY_NAMESPACE: agyn-platform'))
          PYCODE
          mkdir -p dist
          buf generate https://github.com/spk-ai/api.git#ref=ce64da8680c39a13f7174c3146b38f3bfcc03037,subdir=proto --path agynio/api/identity/v1 --path agynio/api/authorization/v1
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/identity-devspace ./cmd/identity-service
          devspace dev

      - name: Verify identity source deployment
        run: |-
          set -euo pipefail
          selector="app.kubernetes.io/name=identity"
          source_pod=""
          extra_pods=""
          elapsed=0
          while [ "${elapsed}" -lt 180 ]; do
            source_pod="$(kubectl get pods -n agyn-platform -l "${selector}" \
              -o jsonpath='{range .items[?(@.spec.containers[0].image=="ghcr.io/agynio/devcontainer-go:1")]}{.metadata.name}{"\n"}{end}' \
              | head -n 1)"
            extra_pods="$(kubectl get pods -n agyn-platform -l "${selector}" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\n"}{end}' \
              | awk '$2 != "ghcr.io/agynio/devcontainer-go:1" { print }')"
            if [ -n "${source_pod}" ] && [ -z "${extra_pods}" ]; then
              break
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          if [ -z "${source_pod}" ] || [ -n "${extra_pods}" ]; then
            if [ -z "${source_pod}" ]; then
              echo "identity source pod not found" >&2
            fi
            if [ -n "${extra_pods}" ]; then
              echo "non-source identity pods are still active:" >&2
              printf '%s\n' "${extra_pods}" >&2
            fi
            kubectl get application identity -n argocd -o yaml >&2 || true
            kubectl get deployment identity -n agyn-platform -o yaml >&2 || true
            kubectl get replicasets -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl get pods -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl describe pods -n agyn-platform -l "${selector}" >&2 || true
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --tail=300 >&2 || true
            exit 1
          fi
          kubectl logs "pod/${source_pod}" -n agyn-platform --all-containers --tail=200

      - name: Register cluster-admin identities
        working-directory: .e2e-deps/identity
        run: |-
          set -euo pipefail
          identity_ids="a3c1e9d2-7f4b-5e1a-9c3d-2b8f6a4e7d10"
          # The Gateway's own identity is whatever the cluster-admin token maps
          # to, which the token's holder can only learn by asking. The URL and
          # token come from the provisioning step's environment.
          if [ -n "${AGYN_BASE_URL:-}" ] && [ -n "${AGYN_API_TOKEN:-}" ]; then
            me_payload="$(curl -fsSk -H "Authorization: Bearer ${AGYN_API_TOKEN}" "${AGYN_BASE_URL}/me" || true)"
            gateway_identity_id="$(node -e 'let data=""; process.stdin.on("data", c => data += c); process.stdin.on("end", () => { try { const p = JSON.parse(data || "{}"); process.stdout.write(String(p.identity_id || "").trim()); } catch (_) {} });' <<<"${me_payload}")"
            if [ -n "${gateway_identity_id}" ] && ! printf '%s\n' "${identity_ids}" | grep -Fxq "${gateway_identity_id}"; then
              identity_ids="$(printf '%s\n%s' "${identity_ids}" "${gateway_identity_id}")"
            fi
          fi
          kubectl port-forward -n agyn-platform svc/identity 15051:50051 >/tmp/identity-port-forward.log 2>&1 &
          port_forward_pid="$!"
          cleanup() {
            kill "${port_forward_pid}" >/dev/null 2>&1 || true
            wait "${port_forward_pid}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/15051) >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "${port_forward_pid}" >/dev/null 2>&1; then
              cat /tmp/identity-port-forward.log >&2 || true
              exit 1
            fi
            if [ "${i}" -eq 60 ]; then
              cat /tmp/identity-port-forward.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          seed_file="$(mktemp register-e2e-identities-XXXX.go)"
          trap 'rm -f "${seed_file}"; cleanup' EXIT
          cat >"${seed_file}" <<'GO'
          package main

          import (
            "context"
            "fmt"
            "os"
            "strings"
            "time"

            identityv1 "github.com/agynio/identity/.gen/go/agynio/api/identity/v1"
            "google.golang.org/grpc"
            "google.golang.org/grpc/codes"
            "google.golang.org/grpc/credentials/insecure"
            "google.golang.org/grpc/status"
          )

          func main() {
            rawIDs := strings.TrimSpace(os.Getenv("E2E_IDENTITY_IDS"))
            if rawIDs == "" {
              panic("E2E_IDENTITY_IDS is empty")
            }
            ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
            defer cancel()
            conn, err := grpc.NewClient("127.0.0.1:15051", grpc.WithTransportCredentials(insecure.NewCredentials()))
            if err != nil {
              panic(err)
            }
            defer conn.Close()
            client := identityv1.NewIdentityServiceClient(conn)
            ids := strings.Fields(rawIDs)
            for _, identityID := range ids {
              _, err := client.RegisterIdentity(ctx, &identityv1.RegisterIdentityRequest{
                IdentityId: identityID,
                IdentityType: identityv1.IdentityType_IDENTITY_TYPE_USER,
              })
              if err != nil && status.Code(err) != codes.AlreadyExists {
                panic(fmt.Errorf("register identity %s: %w", identityID, err))
              }
            }
            response, err := client.BatchGetIdentityTypes(ctx, &identityv1.BatchGetIdentityTypesRequest{IdentityIds: ids})
            if err != nil {
              panic(fmt.Errorf("verify identities: %w", err))
            }
            if len(response.GetEntries()) != len(ids) {
              panic(fmt.Errorf("verify identities: expected %d entries, got %d", len(ids), len(response.GetEntries())))
            }
            fmt.Printf("registered %d cluster-admin identities\n", len(ids))
          }
          GO
          E2E_IDENTITY_IDS="${identity_ids}" go run "${seed_file}"

