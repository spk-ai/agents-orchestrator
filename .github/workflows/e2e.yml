      # The pinned runner's own image ships /app/workload-proxy; built from
      # the same checkout the runner is deployed from, loaded into the VM.
      - name: Build the workload proxy image from the pinned runner
        if: matrix.network == 'explicit-proxy'
        working-directory: .e2e-deps/k8s-runner
        run: |-
          set -euo pipefail
          image="e2e/workload-proxy:$(git rev-parse --short=12 HEAD)"
          docker build --progress=plain -t "${image}" .
          out="$(docker run --rm --read-only --user 10001:10001 --entrypoint /app/workload-proxy "${image}" no-such-command 2>&1 || true)"
          grep -q 'unknown subcommand' <<<"${out}" || { echo "workload-proxy did not start as 10001 on a read-only root: ${out}" >&2; exit 1; }
          agyn local load-image "${image}"
          {
            echo "WORKLOAD_PROXY_IMAGE=${image}"
            echo "WORKLOAD_NETWORK_MODE=explicit-proxy"
          } >> "${GITHUB_ENV}"

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.4

      # The VM's platform release predates the chart's volume-backend grant and
      # the source deployment is patched in place, so apply the pinned chart's
      # own render, exactly as k8s-runner's E2E does. The script proves the only
      # added permission is get on the single workload Namespace.
      - name: Grant the source chart's volume-backend namespace read
        working-directory: .e2e-deps/k8s-runner
        run: python3 .github/e2e/volume-backend-rbac.py

      # Prepared starts keep revocation records in workload ConfigMaps and give
      # Pod ownership to startup Secrets; the VM's release predates those rules.
      # The pinned script proves the grant is the chart's own Role, confined to
      # the workload namespace.
      - name: Grant the source chart's workload rules
        working-directory: .e2e-deps/k8s-runner
        run: python3 .github/e2e/workload-rbac.py

      - name: Deploy k8s-runner from source
        working-directory: .e2e-deps/k8s-runner
        env:
          RUNNER_POD_SECURITY: ${{ matrix.runner_pod_security }}
        run: |-
          set -euo pipefail
          dump_k8s_runner_source_diagnostics() {
            selector="app.kubernetes.io/name=k8s-runner"
            echo "== k8s-runner source deployment diagnostics ==" >&2
            kubectl get application k8s-runner -n argocd -o yaml >&2 || true
            kubectl get deployment k8s-runner -n agyn-platform -o yaml >&2 || true
            kubectl get replicasets -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl get pods -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl describe pods -n agyn-platform -l "${selector}" >&2 || true
            echo "== k8s-runner current logs ==" >&2
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --tail=500 >&2 || true
            echo "== k8s-runner previous logs ==" >&2
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --previous --tail=500 >&2 || true
            echo "== platform events ==" >&2
            kubectl get events -n agyn-platform --sort-by=.metadata.creationTimestamp >&2 || true
          }
          trap dump_k8s_runner_source_diagnostics ERR
          # While the router's data model lags a new identity, SDK bind retries
          # log thousands of lines a second and push the ready line out of a
          # 200-line tail; the runner binds once the router catches up. Read
          # the whole log and drain it, so kubectl never sees SIGPIPE.
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('devspace.yaml')
          s = p.read_text()
          old = ('until kubectl logs -n ${K8S_RUNNER_NAMESPACE} -l "${LABEL_SELECTOR}" --tail=200 2>/dev/null | \\\n'
                 '      grep -q "gRPC server starting"; do')
          new = old.replace('--tail=200', '--tail=-1').replace(
              'grep -q "gRPC server starting"', "awk '/gRPC server starting/ { found = 1 } END { exit !found }'")
          # The pinned runner already drains the whole log itself.
          assert s.count(old) + s.count(new) == 1, 'pinned k8s-runner ready-log contract changed'
          p.write_text(s.replace(old, new))
          # Two fits for this disposable VM's catalog; every other value stays
          # as pinned.
          # - The catalog caps every sidecar, MCP servers included, at 500m and
          #   256Mi. The suite's memory MCP is stateless `npx -y supergateway`
          #   spawning `npx -y @modelcontextprotocol/server-memory` per request.
          #   Under 256Mi the install is OOM-killed; under 500m it outlasts
          #   agynd's fixed 10s readiness request, and supergateway 3.4.3 then
          #   exits on the late reply ("No connection established for request
          #   ID: agynd-mcp-ready"). Sidecars get the main container's 2 CPUs
          #   and 1Gi, still a budget of their own.
          # - The source-run services already reserve ~3.1 of the VM's 4 CPUs,
          #   so a 500m default-flavor request admits one workload pod at a
          #   time ("Insufficient cpu"). Agent-to-agent tests need two at
          #   once and the start-retry test waits on the previous test's pod,
          #   so the default flavor reserves 100m; its 2-CPU limit is unchanged.
          c = Path('catalog.dev.yaml')
          cs = c.read_text()
          cap = '    sidecarResources:\n      requestsCpu: "50m"\n      requestsMemory: "64Mi"\n      limitsCpu: "500m"\n      limitsMemory: "256Mi"\n'
          assert cs.count(cap) == 2, 'pinned k8s-runner sidecar catalog contract changed'
          cs = cs.replace(cap, cap.replace('limitsCpu: "500m"', 'limitsCpu: "2"').replace('limitsMemory: "256Mi"', 'limitsMemory: "1Gi"'))
          reserve = '  - name: ram-2gb\n    default: true\n    resources:\n      requestsCpu: "500m"\n'
          assert cs.count(reserve) == 1, 'pinned k8s-runner default flavor contract changed'
          c.write_text(cs.replace(reserve, reserve.replace('requestsCpu: "500m"', 'requestsCpu: "100m"')))
          # The leg's workload Pod profile, set with the pinned deploy's own
          # environment update so the source Pod starts with it.
          import os
          s = p.read_text()
          sweep = 'WORKLOAD_SECRET_SWEEP_INTERVAL=15s WORKLOAD_SECRET_SWEEP_GRACE=1m\n'
          assert s.count(sweep) == 1, 'pinned k8s-runner deploy environment contract changed'
          p.write_text(s.replace(sweep, sweep[:-1] + ' ' + os.environ['RUNNER_POD_SECURITY'] + '\n'))
          PYCODE
          devspace run deploy
          profile="$(kubectl logs -n agyn-platform -l app.kubernetes.io/name=k8s-runner --tail=-1 | awk '/workload pod security/ && !found { print; found = 1 }')"
          echo "k8s-runner: ${profile}"
          case "${RUNNER_POD_SECURITY}" in
            WORKLOAD_POD_SECURITY=restricted*) grep -q '"profile":"restricted"' <<<"${profile}" ;;
            *) grep -q '"profile":"none"' <<<"${profile}" && grep -q 'NET_ADMIN' <<<"${profile}" ;;
          esac

      - name: Verify disposable VM native network inventory
        run: python3 .github/e2e/verify-vm-network.py

      - name: Verify workload Ziti DNS
        run: |-
          set -euo pipefail
          dump_ziti_dns_preflight_diagnostics() {
            kubectl get pod ziti-dns-preflight -n agyn-workloads -o wide || true
            kubectl describe pod ziti-dns-preflight -n agyn-workloads || true
            kubectl logs pod/ziti-dns-preflight -n agyn-workloads --all-containers=true --tail=-1 || true
            kubectl get configmap coredns-custom -n kube-system -o yaml || true
            kubectl get service,endpoints,pods -n kube-system -l k8s-app=kube-dns -o wide || true
            kubectl get service,endpoints -n ziti ziti-controller-client ziti-router-edge -o wide || true
            kubectl get service,endpoints -n istio-gateway istio-ingressgateway -o wide || true
            kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml || true
            kubectl get pods -n agyn-workloads -o wide || true
            kubectl logs -n agyn-workloads -l app.kubernetes.io/name=ziti-sidecar --all-containers --tail=200 || true
            kubectl logs -n agyn-workloads -l agyn.dev/component=ziti-sidecar --all-containers --tail=200 || true
          }
          ziti_dns_ip="${WORKLOAD_TEST_DNS_SERVICE_IP:?native DNS inventory missing}"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "native workload DNS ClusterIP is empty" >&2
            dump_ziti_dns_preflight_diagnostics
            exit 1
          fi
          ziti_dns_endpoint_ip="${WORKLOAD_TEST_DNS_ENDPOINT_IP:?native DNS endpoint inventory missing}"
          if [ -z "${ziti_dns_endpoint_ip}" ]; then
            echo "native workload DNS endpoint IP is empty" >&2
            dump_ziti_dns_preflight_diagnostics
            exit 1
          fi
          echo "native workload DNS service ClusterIP: ${ziti_dns_ip}"
          echo "native workload DNS first endpoint IP: ${ziti_dns_endpoint_ip}"
          kubectl get service,endpoints,pods -n kube-system -l k8s-app=kube-dns -o wide
          kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --ignore-not-found
          cat <<EOF_POD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ziti-dns-preflight
            namespace: agyn-workloads
            labels:
              agyn.dev/managed-by: agents-orchestrator
          spec:
            restartPolicy: Never
            dnsPolicy: None
            dnsConfig:
              nameservers:
                - ${ziti_dns_ip}
            containers:
              - name: ziti-dns-preflight
                image: busybox:1.37.0
                env:
                  - name: ZITI_DNS_SERVICE_IP
                    value: "${ziti_dns_ip}"
                  - name: ZITI_DNS_ENDPOINT_IP
                    value: "${ziti_dns_endpoint_ip}"
                command:
                  - sh
                  - -c
                  - |-
                    set -eu
                    run_lookup() {
                      host="\${1}"
                      server_name="\${2}"
                      server_ip="\${3}"
                      echo "== nslookup \${host} via \${server_name} \${server_ip} =="
                      timeout 30 nslookup "\${host}" "\${server_ip}"
                    }
                    run_lookup ziti.agyn.dev service-cluster-ip "\${ZITI_DNS_SERVICE_IP}"
                    run_lookup ziti-router.agyn.dev service-cluster-ip "\${ZITI_DNS_SERVICE_IP}"
                    run_lookup ziti.agyn.dev endpoint-pod-ip "\${ZITI_DNS_ENDPOINT_IP}"
                    run_lookup ziti-router.agyn.dev endpoint-pod-ip "\${ZITI_DNS_ENDPOINT_IP}"
                    echo "== tcp connect to service-cluster-ip \${ZITI_DNS_SERVICE_IP}:53 =="
                    timeout 10 nc -vz -w 5 "\${ZITI_DNS_SERVICE_IP}" 53
                    echo "== tcp connect to endpoint-pod-ip \${ZITI_DNS_ENDPOINT_IP}:53 =="
                    timeout 10 nc -vz -w 5 "\${ZITI_DNS_ENDPOINT_IP}" 53
                    echo "== tcp connect to ziti-router.agyn.dev:2496 through workload DNS =="
                    timeout 10 nc -vz -w 5 ziti-router.agyn.dev 2496
          EOF_POD
          if ! kubectl wait pod/ziti-dns-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            echo "native workload DNS UDP/TCP 53 preflight failed from agyn-workloads" >&2
            kubectl get pod ziti-dns-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-dns-preflight -n agyn-workloads >&2 || true
            dump_ziti_dns_preflight_diagnostics >&2
            exit 1
          fi
          kubectl logs pod/ziti-dns-preflight -n agyn-workloads
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --wait=false

      - name: Verify workload Ziti runtime TCP
        run: |-
          set -euo pipefail
          ziti_dns_ip="${WORKLOAD_TEST_DNS_SERVICE_IP:?native DNS inventory missing}"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "native workload DNS ClusterIP is empty" >&2
            exit 1
          fi
          kubectl delete pod ziti-runtime-preflight -n agyn-workloads --ignore-not-found
          cat <<EOF_POD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ziti-runtime-preflight
            namespace: agyn-workloads
            labels:
              agyn.dev/managed-by: agents-orchestrator
          spec:
            restartPolicy: Never
            dnsPolicy: None
            dnsConfig:
              nameservers:
                - ${ziti_dns_ip}
            containers:
              - name: ziti-runtime-preflight
                image: curlimages/curl:8.16.0
                command:
                  - sh
                  - -c
                  - curl --insecure --fail --show-error --verbose --connect-timeout 10 --max-time 30 https://ziti.agyn.dev:2496/edge/client/v1/version
          EOF_POD
          if ! kubectl wait pod/ziti-runtime-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            echo "ziti runtime TCP preflight failed with selector-aware controller policy present" >&2
            kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml >&2 || true
            kubectl get service,endpoints -n ziti ziti-controller-client -o wide >&2 || true
            kubectl get service,endpoints,pods -n kube-system -l k8s-app=kube-dns -o wide >&2 || true
            kubectl get pod ziti-runtime-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-runtime-preflight -n agyn-workloads >&2 || true
            exit 1
          fi
          kubectl logs pod/ziti-runtime-preflight -n agyn-workloads
          kubectl delete pod ziti-runtime-preflight -n agyn-workloads --wait=false

      - name: Verify stock sidecar runtime DNS path
        run: |-
          set -euo pipefail
          ziti_dns_ip="${WORKLOAD_TEST_DNS_SERVICE_IP:?native DNS inventory missing}"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "native workload DNS ClusterIP is empty" >&2
            exit 1
          fi
          kubectl delete pod ziti-sidecar-dns-preflight -n agyn-workloads --ignore-not-found
          cat <<EOF_POD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ziti-sidecar-dns-preflight
            namespace: agyn-workloads
            labels:
              agyn.dev/managed-by: agents-orchestrator
          spec:
            restartPolicy: Never
            dnsPolicy: None
            dnsConfig:
              nameservers:
                - 127.0.0.1
                - ${ziti_dns_ip}
              searches:
                - svc.cluster.local
                - cluster.local
            containers:
              - name: ziti-sidecar-dns-preflight
                image: openziti/ziti-tunnel:2.0.0-pre10
                env:
                  - name: WORKLOAD_DNS_UPSTREAM
                    value: "${ziti_dns_ip}"
                command:
                  - /usr/bin/bash
                  - -ec
                  - |-
                    echo "== initial resolv.conf =="
                    cat /etc/resolv.conf
                    printf 'nameserver %s\nsearch svc.cluster.local cluster.local\noptions ndots:5\n' "\${WORKLOAD_DNS_UPSTREAM}" > /etc/resolv.conf
                    echo "== sidecar runtime auth resolv.conf =="
                    cat /etc/resolv.conf
                    echo "== tcp connect ziti.agyn.dev:2496 from stock sidecar image =="
                    bash -c '</dev/tcp/ziti.agyn.dev/2496'
                    echo "== tcp connect ziti-router.agyn.dev:2496 from stock sidecar image =="
                    bash -c '</dev/tcp/ziti-router.agyn.dev/2496'
          EOF_POD
          if ! kubectl wait pod/ziti-sidecar-dns-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            echo "stock ziti sidecar runtime DNS path failed from workload pod context" >&2
            kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml >&2 || true
            kubectl get service,endpoints,pods -n kube-system -l k8s-app=kube-dns -o wide >&2 || true
            kubectl get pod ziti-sidecar-dns-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-sidecar-dns-preflight -n agyn-workloads >&2 || true
            exit 1
          fi
          kubectl logs pod/ziti-sidecar-dns-preflight -n agyn-workloads
          kubectl delete pod ziti-sidecar-dns-preflight -n agyn-workloads --wait=false

      # spk-ai/gateway#2: /readyz is 200 only after a router confirmed the
      # Ziti terminator, and the listening line is logged only after that.
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          repository: spk-ai/gateway
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.gateway_ref || env.GATEWAY_REF }}
          path: .e2e-deps/gateway

      - name: Deploy gateway from source
        working-directory: .e2e-deps/gateway
        run: |-
          set -euo pipefail
          dump_gateway_source_diagnostics() {
            selector="app.kubernetes.io/name=gateway"
            echo "== gateway source deployment diagnostics ==" >&2
            kubectl get application gateway -n argocd -o yaml >&2 || true
            kubectl get deployment gateway -n agyn-platform -o yaml >&2 || true
            kubectl get replicasets -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl get pods -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl describe pods -n agyn-platform -l "${selector}" >&2 || true
            echo "== gateway current logs ==" >&2
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --tail=500 >&2 || true
            echo "== gateway previous logs ==" >&2
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --previous --tail=500 >&2 || true
            echo "== platform events ==" >&2
            kubectl get events -n agyn-platform --sort-by=.metadata.creationTimestamp >&2 || true
          }
          trap dump_gateway_source_diagnostics ERR
          # The pinned gateway generates from the reviewed fork API itself; fail
          # if that pin drifts rather than building against a different contract.
          python3 - <<'PYCODE'
          from pathlib import Path
          gen = Path('buf.gen.yaml').read_text()
          assert 'git_repo: https://github.com/spk-ai/api.git' in gen and 'ref: ce64da8680c39a13f7174c3146b38f3bfcc03037' in gen, 'pinned gateway generation contract changed'
          assert 'buf generate --include-imports' in Path('scripts/devspace-startup.sh').read_text(), 'pinned gateway generation contract changed'
          PYCODE
          buf generate --include-imports
          CGO_ENABLED=0 go test ./cmd/gateway ./internal/identity ./internal/zitimgmtclient
          node <<'NODE'
          const fs = require('fs');
          const path = 'devspace.yaml';
          let text = fs.readFileSync(path, 'utf8');
          const scaleDownMarker = 'Scaling gateway down before source patch...';
          if (!text.includes(scaleDownMarker)) {
            const marker = '      echo "Patching gateway deployment for DevSpace..."';
            if (!text.includes(marker)) {
              throw new Error('gateway DevSpace patch marker not found');
            }
            text = text.replace(marker, [
              '      label_selector="app.kubernetes.io/name=gateway"',
              '      echo "' + scaleDownMarker + '"',
              '      kubectl scale deployment/gateway -n ${GATEWAY_NAMESPACE} --replicas=0',
              '      if [ -n "$(kubectl get pods -n ${GATEWAY_NAMESPACE} -l "${label_selector}" -o name)" ]; then',
              '        kubectl wait --for=delete pod -n ${GATEWAY_NAMESPACE} -l "${label_selector}" --timeout=240s',
              '      fi',
              marker,
            ].join('\n'));
          }
          const rolloutNeedle = [
            '      )"',
            '      if [ "$(get_flag "watch")" == "true" ]; then',
          ].join('\n');
          if (!text.includes('strategy":{"type":"Recreate","rollingUpdate":null}')) {
            if (!text.includes(rolloutNeedle)) {
              throw new Error('gateway DevSpace rollout marker not found');
            }
            text = text.replace(rolloutNeedle, [
              '      )"',
              "      kubectl patch deployment gateway -n ${GATEWAY_NAMESPACE} --type merge -p '{\"spec\":{\"strategy\":{\"type\":\"Recreate\",\"rollingUpdate\":null}}}'",
              '      kubectl scale deployment/gateway -n ${GATEWAY_NAMESPACE} --replicas=1',
              '      kubectl rollout status deployment/gateway -n ${GATEWAY_NAMESPACE} --timeout=240s',
              '      if [ "$(get_flag "watch")" == "true" ]; then',
            ].join('\n'));
          }
          fs.writeFileSync(path, text);
          NODE
          devspace dev

      # Readiness, not log text: the Ziti SDK logs thousands of bind rejections
      # around the listening line, and ListenWithOptions returns before any
      # router accepts the bind.
      - name: Verify gateway Ziti service binding
        id: gateway_ziti_ready
        run: |-
          set -euo pipefail
          selector="app.kubernetes.io/name=gateway"
          source_pod=""
          elapsed=0
          while [ "${elapsed}" -lt 180 ]; do
            source_pod="$(kubectl get pods -n agyn-platform -l "${selector}" \
              -o jsonpath='{range .items[?(@.spec.containers[0].image=="ghcr.io/agynio/devcontainer-go:1.1.0")]}{.metadata.name}{"\n"}{end}' \
              | head -n 1)"
            if [ -n "${source_pod}" ]; then
              break
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          if [ -z "${source_pod}" ]; then
            echo "gateway source pod not found" >&2
            kubectl get application gateway -n argocd -o yaml >&2 || true
            kubectl get deployment gateway -n agyn-platform -o yaml >&2 || true
            kubectl get replicasets -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl get pods -n agyn-platform -l "${selector}" -o wide >&2 || true
            kubectl describe pods -n agyn-platform -l "${selector}" >&2 || true
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --tail=500 >&2 || true
            exit 1
          fi
          ziti_enabled="$(kubectl get deployment gateway -n agyn-platform -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="ZITI_ENABLED")]}{.value}{end}')"
          if [ "${ziti_enabled}" != "true" ]; then
            echo "gateway source deployment is not configured with ZITI_ENABLED=true" >&2
            kubectl get deployment gateway -n agyn-platform -o yaml >&2 || true
            exit 1
          fi
          print_bind_summary() {
            logs="$(mktemp)"
            for previous in false true; do
              kubectl logs "pod/${source_pod}" -n agyn-platform --all-containers --timestamps --previous="${previous}" \
                2>/dev/null >>"${logs}" || true
            done
            echo "== gateway Ziti bind summary (${source_pod}) =="
            echo "router rejections (identity not found by id): $(grep -c 'identity not found by id' "${logs}" || true)"
            echo "SDK bind errors: $(grep -cE 'bind request resulted in disconnect|creating listener failed|failed to establish listener' "${logs}" || true)"
            echo "-- first SDK bind errors --"
            grep -E 'bind request resulted in disconnect|creating listener failed|failed to establish listener' "${logs}" | head -n 6 | cut -c1-400 || true
            echo "-- last SDK bind errors --"
            grep -E 'bind request resulted in disconnect|creating listener failed|failed to establish listener' "${logs}" | tail -n 6 | cut -c1-400 || true
            echo "-- gateway Ziti manager --"
            grep -E 'gateway listening on|ziti enrollment|re-enrolling ziti|ziti service listener|ziti lease|bind ziti service|establish ziti service listener|lost ziti service listener|failed to load platform configuration' \
              "${logs}" | tail -n 80 | cut -c1-400 || true
            rm -f "${logs}"
          }
          port_forward_log="$(mktemp)"
          start_port_forward() {
            kubectl port-forward -n agyn-platform "pod/${source_pod}" 18090:8080 >"${port_forward_log}" 2>&1 &
            port_forward_pid="$!"
          }
          cleanup() {
            kill "${port_forward_pid}" >/dev/null 2>&1 || true
            wait "${port_forward_pid}" >/dev/null 2>&1 || true
          }
          start_port_forward
          trap cleanup EXIT
          started="${SECONDS}"
          last_status=""
          while :; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18090/readyz 2>/dev/null || true)"
            if [ "${status}" = "200" ]; then
              echo "gateway /readyz returned 200 after $((SECONDS - started))s"
              print_bind_summary
              exit 0
            fi
            if [ "${status}" != "${last_status}" ]; then
              echo "gateway /readyz returned ${status:-no response} after $((SECONDS - started))s"
              last_status="${status}"
            fi
            if [ "$((SECONDS - started))" -ge 240 ]; then
              echo "gateway Ziti service listener not established within 240s (/readyz ${status:-no response})" >&2
              cat "${port_forward_log}" >&2 || true
              kubectl get pods -n agyn-platform -l "${selector}" -o wide >&2 || true
              print_bind_summary >&2
              exit 1
            fi
            if ! kill -0 "${port_forward_pid}" >/dev/null 2>&1; then
              cat "${port_forward_log}" >&2 || true
              start_port_forward
            fi
            sleep 2
          done

      # The router-side view right after binding; the final collection may
      # only see a data model that caught up later.
      - name: Snapshot Ziti state after gateway binding
        if: ${{ always() && steps.gateway_ziti_ready.outcome != 'skipped' }}
        run: bash .github/e2e/collect-ziti-diagnostics.sh "${RUNNER_TEMP}/ziti-diagnostics/after-gateway-binding"

      - name: Checkout api
        uses: actions/checkout@v4
        with:
          repository: spk-ai/api
          ref: f62e2ad47a5ea5451d88c3cc0138f73be708eb55
          path: api

      - name: Checkout llm-proxy
        uses: actions/checkout@v4
        with:
          repository: agynio/llm-proxy
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.llm_proxy_ref || env.LLM_PROXY_REF }}
          path: .e2e-deps/llm-proxy

      - name: Deploy llm-proxy from source
        working-directory: .e2e-deps/llm-proxy
        run: |-
          set -euo pipefail
          protoc_bin="${RUNNER_TEMP}/llm-proxy-protoc-gen"
          proto_input="${GITHUB_WORKSPACE}/api/proto"
          proto_template="${RUNNER_TEMP}/llm-proxy-local-buf.gen.yaml"
          mkdir -p "${protoc_bin}"
          CGO_ENABLED=0 GOBIN="${protoc_bin}" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          CGO_ENABLED=0 GOBIN="${protoc_bin}" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          cat >"${proto_template}" <<'EOF'
          version: v2
          managed:
            enabled: true
            override:
              - file_option: go_package_prefix
                value: github.com/agynio/llm-proxy/.gen/go
          plugins:
            - local: protoc-gen-go
              out: .gen/go
              opt:
                - paths=source_relative
            - local: protoc-gen-go-grpc
              out: .gen/go
              opt:
                - paths=source_relative
                - require_unimplemented_servers=false
          EOF
          PATH="${protoc_bin}:${PATH}" buf generate "${proto_input}" \
            --path "${proto_input}/agynio/api/agents/v1" \
            --path "${proto_input}/agynio/api/notifications/v1" \
            --path "${proto_input}/agynio/api/llm/v1" \
            --path "${proto_input}/agynio/api/users/v1" \
            --path "${proto_input}/agynio/api/organizations/v1" \
            --path "${proto_input}/agynio/api/authorization/v1" \
            --path "${proto_input}/agynio/api/metering/v1" \
            --path "${proto_input}/agynio/api/ziti_management/v1" \
            --path "${proto_input}/agynio/api/identity/v1" \
            --template "${proto_template}"
          gofmt -w internal/proxy/handler.go
          CGO_ENABLED=0 go test ./cmd/llm-proxy ./internal/proxy
          mkdir -p dist
          CGO_ENABLED=0 go build -o dist/llm-proxy-devspace ./cmd/llm-proxy
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          p = Path('devspace.yaml')
          s = p.read_text()
          pattern = r'                  set -eu\n.*?                  exec go run ./cmd/llm-proxy'
          replacement = '                  set -eu\n                  elapsed=0\n                  while [ ! -x /opt/app/data/dist/llm-proxy-devspace ]; do\n                    sleep 1; elapsed=$((elapsed + 1))\n                    [ "$elapsed" -ge 300 ] && { echo "ERROR: source binary sync timeout" >&2; exit 1; }\n                  done\n                  exec /opt/app/data/dist/llm-proxy-devspace'
          s, count = re.subn(pattern, lambda _: replacement, s, flags=re.S)
          assert count == 1, 'pinned llm-proxy startup contract changed'
          p.write_text(s)
          PYCODE
          deployment="$(kubectl get deployment -n agyn-platform -l app.kubernetes.io/name=llm-proxy -o jsonpath='{.items[0].metadata.name}')"
          test -n "${deployment}"
          kubectl patch deployment "${deployment}" -n agyn-platform --type merge -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
          devspace dev
      # Validation only: llm-proxy Ziti binding is configured by the platform image.
      - name: Verify llm-proxy Ziti service binding
        run: |-
          set -euo pipefail
          wait_argocd_app_sync_finished() {
            app="$1"
            i=0
            while [ "$i" -lt 240 ]; do
              sync_status="$(kubectl get application "$app" -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null || true)"
              health_status="$(kubectl get application "$app" -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null || true)"
              operation_phase="$(kubectl get application "$app" -n argocd -o jsonpath='{.status.operationState.phase}' 2>/dev/null || true)"
              if [ "$sync_status" = "Synced" ] && { [ -z "$operation_phase" ] || [ "$operation_phase" = "Succeeded" ]; }; then
                if [ "$health_status" != "Healthy" ]; then
                  echo "$app ArgoCD application synced but health is ${health_status:-unknown}; validating deployment and Ziti binding directly." >&2
                fi
                return 0
              fi
              i=$((i + 1))
              sleep 1
            done
            echo "$app ArgoCD application did not report completed sync within timeout; validating deployment and Ziti binding directly." >&2
            kubectl get application "$app" -n argocd -o yaml >&2 || true
          }
          wait_argocd_app_sync_finished llm-proxy
          deployment="$(kubectl get deployment -n agyn-platform -l app.kubernetes.io/instance=llm-proxy -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [ -z "${deployment}" ]; then
            deployment="$(kubectl get deployment -n agyn-platform -l app.kubernetes.io/name=llm-proxy -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          fi
          if [ -z "${deployment}" ]; then
            echo "llm-proxy deployment not found" >&2
            kubectl get application llm-proxy -n argocd -o yaml >&2 || true
            kubectl get deployments -n agyn-platform -o wide >&2 || true
            exit 1
          fi
          kubectl rollout status "deployment/${deployment}" -n agyn-platform --timeout=240s
          ziti_enabled_values="$(kubectl get "deployment/${deployment}" -n agyn-platform -o jsonpath='{range .spec.template.spec.containers[*].env[?(@.name=="ZITI_ENABLED")]}{.value}{"\n"}{end}')"
          ziti_enabled="$(printf '%s\n' "${ziti_enabled_values}" | awk 'NF { value=$0 } END { print value }')"
          if [ "${ziti_enabled}" != "true" ]; then
            echo "llm-proxy deployment is not source-of-truth configured with ZITI_ENABLED=true" >&2
            kubectl get application llm-proxy -n argocd -o yaml >&2 || true
            kubectl get "deployment/${deployment}" -n agyn-platform -o yaml >&2 || true
            exit 1
          fi
          attempts=0
          while [ "${attempts}" -lt 120 ]; do
            # The whole log, saved first so an early grep exit cannot SIGPIPE
            # kubectl under pipefail: while the router's data model lags a new
            # identity, SDK bind retries can bury the line under any fixed tail.
            kubectl logs "deployment/${deployment}" -n agyn-platform --all-containers --tail=-1 >"${RUNNER_TEMP}/llm-proxy.log" 2>/dev/null || true
            if grep -q 'llm-proxy listening on ziti service llm-proxy' "${RUNNER_TEMP}/llm-proxy.log"; then
              kubectl logs "deployment/${deployment}" -n agyn-platform --all-containers --tail=200
              exit 0
            fi
            attempts=$((attempts + 1))
            sleep 1
          done
          echo "llm-proxy did not report Ziti service listener from the source-of-truth deployment" >&2
          kubectl get application llm-proxy -n argocd -o yaml >&2 || true
          kubectl get "deployment/${deployment}" -n agyn-platform -o yaml >&2 || true
          kubectl get pods -n agyn-platform -l app.kubernetes.io/instance=llm-proxy -o wide >&2 || true
          kubectl get pods -n agyn-platform -l app.kubernetes.io/name=llm-proxy -o wide >&2 || true
          kubectl logs "deployment/${deployment}" -n agyn-platform --all-containers --tail=500 >&2 || true
          exit 1
      # After the Ziti preflights above, which run root busybox and tunnel
      # images in agyn-workloads on purpose.
      - name: Enforce restricted Pod Security and the overlay-only task network
        if: matrix.network == 'explicit-proxy'
        run: python3 .github/e2e/restricted-network.py prepare

      - name: Deploy orchestrator from source
        id: orchestrator_deploy
        run: devspace run deploy

      - name: Checkout e2e
        uses: actions/checkout@v4
        with:
          repository: agynio/e2e
          ref: 435b549a937129b6858e7314648eb690894209fe
          path: e2e

      - name: Checkout OpenTelemetry proto
        uses: actions/checkout@v4
        with:
          repository: open-telemetry/opentelemetry-proto
          ref: v1.10.0
          path: opentelemetry-proto

      - name: Patch e2e for agent-instance workloads
        working-directory: e2e
        run: |-
          set -euo pipefail
          node ../.github/scripts/patch-e2e-agent-instances.js
          python3 ../.e2e-deps/k8s-runner/.github/e2e/patch-native-client.py .
          cp ../.github/e2e/gateway_ziti_probe_test.go.txt suites/go-core/tests/gateway_ziti_probe_test.go
          # Compiled only with the failed_workload_retention tag, by the last
          # step against a retention-enabled orchestrator.
          cp ../.github/e2e/failed_workload_retention_test.go.txt suites/go-core/tests/failed_workload_retention_test.go
          if [ "${{ matrix.network }}" = explicit-proxy ]; then
            cp ../.github/e2e/restricted_network_test.go.txt suites/go-core/tests/restricted_network_test.go
          fi
          cd suites/go-core

          protoc_bin="${RUNNER_TEMP}/go-core-protoc-gen"
          proto_input="${RUNNER_TEMP}/go-core-proto-input"
          proto_template="${RUNNER_TEMP}/go-core-local-buf.gen.yaml"
          mkdir -p "${protoc_bin}" "${proto_input}"
          CGO_ENABLED=0 GOBIN="${protoc_bin}" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          CGO_ENABLED=0 GOBIN="${protoc_bin}" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          CGO_ENABLED=0 GOBIN="${protoc_bin}" go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.13.0

          rm -rf "${proto_input}"
          mkdir -p "${proto_input}"
          cp -R "${GITHUB_WORKSPACE}/api/proto/agynio" "${proto_input}/agynio"
          cp -R "${GITHUB_WORKSPACE}/opentelemetry-proto/opentelemetry" "${proto_input}/opentelemetry"
          cat >"${proto_template}" <<'EOF'
          version: v2
          managed:
            enabled: true
            override:
              - file_option: go_package_prefix
                value: github.com/agynio/e2e/suites/go-core/.gen/go
          plugins:
            - local: protoc-gen-go
              out: .gen/go
              opt:
                - paths=source_relative
            - local: protoc-gen-connect-go
              out: .gen/go
              opt:
                - paths=source_relative
            - local: protoc-gen-go-grpc
              out: .gen/go
              opt:
                - paths=source_relative
                - require_unimplemented_servers=false
          EOF
          PATH="${protoc_bin}:${PATH}" buf generate "${proto_input}" \
            --path "${proto_input}/agynio/api/agents/v1" \
            --path "${proto_input}/agynio/api/egress/v1" \
            --path "${proto_input}/agynio/api/authorization/v1" \
            --path "${proto_input}/agynio/api/files/v1" \
            --path "${proto_input}/agynio/api/gateway/v1/agents.proto" \
            --path "${proto_input}/agynio/api/gateway/v1/llm.proto" \
            --path "${proto_input}/agynio/api/gateway/v1/users.proto" \
            --path "${proto_input}/agynio/api/identity/v1" \
            --path "${proto_input}/agynio/api/images/v1" \
            --path "${proto_input}/agynio/api/llm/v1" \
            --path "${proto_input}/agynio/api/metering/v1" \
            --path "${proto_input}/agynio/api/organizations/v1" \
            --path "${proto_input}/agynio/api/runner/v1" \
            --path "${proto_input}/agynio/api/runners/v1" \
            --path "${proto_input}/agynio/api/secrets/v1" \
            --path "${proto_input}/agynio/api/threads/v1" \
            --path "${proto_input}/agynio/api/tracing/v1" \
            --path "${proto_input}/agynio/api/users/v1" \
            --path "${proto_input}/agynio/api/ziti_management/v1" \
            --path "${proto_input}/opentelemetry/proto/common/v1" \
            --path "${proto_input}/opentelemetry/proto/resource/v1" \
            --path "${proto_input}/opentelemetry/proto/trace/v1" \
            --template "${proto_template}"
          gofmt -w tests/*.go
          find .gen/go -type f -name '*.go' -print0 | xargs -0 gofmt -w
          # The probe enrolls through ziti/enroll, which imports gabs; the
          # pinned suite's go.sum does not list it.
          go get github.com/Jeffail/gabs@v1.4.0
          CGO_ENABLED=0 go test -tags 'e2e svc_agents_orchestrator' ./tests -run TestNonExistent -count=1
          CGO_ENABLED=0 go test -tags 'e2e svc_agents_orchestrator failed_workload_retention' ./tests -run TestNonExistent -count=1

      # Dials the Gateway's own Ziti terminator as a synthetic agent before the
      # long acceptance runs depend on it.
      - name: Probe gateway over native Ziti transport
        uses: ./e2e/.github/actions/run-tests
        env:
          E2E_SUITES: go-core
          E2E_GO_TEST_RUN: "^TestGatewayZitiNativeTransport$"
          E2E_SKIP_BUF_GENERATE: "true"
          E2E_ARTIFACT_NAME_SUFFIX: "-gateway-ziti-probe"
        with:
          e2e-ref: 435b549a937129b6858e7314648eb690894209fe
          service: agents_orchestrator
          include_smoke: "false"

      # Checks the first live orchestrator-assembled task Pod while the
      # focused tests drive real turns through it.
      - name: Watch a live explicit-proxy task Pod
        if: matrix.network == 'explicit-proxy'
        run: nohup python3 .github/e2e/restricted-network.py watch >"${RUNNER_TEMP}/restricted-network-watch.log" 2>&1 &

      - name: Run focused go-core acceptance tests
        uses: ./e2e/.github/actions/run-tests
        env:
          E2E_SUITES: go-core
          E2E_ARTIFACT_NAME_SUFFIX: "-focused"
          E2E_GO_TEST_RUN: ${{ matrix.focused }}
          E2E_SKIP_BUF_GENERATE: "true"
        with:
          e2e-ref: 435b549a937129b6858e7314648eb690894209fe
          service: agents_orchestrator
          include_smoke: "false"

      - name: Verify restricted task Pod shape and network negatives
        if: matrix.network == 'explicit-proxy' && !cancelled()
        timeout-minutes: 25
        run: |-
          set +e
          python3 .github/e2e/restricted-network.py verify
          status=$?
          echo "== watcher log =="
          cat "${RUNNER_TEMP}/restricted-network-watch.log" || true
          exit "${status}"

      - name: Run E2E tests
        if: matrix.network == 'tproxy'
        uses: ./e2e/.github/actions/run-tests
        env:
          E2E_SUITES: go-core playwright-chat-app
          E2E_SKIP_BUF_GENERATE: "true"
          E2E_ARTIFACT_NAME_SUFFIX: "-full"
        with:
          e2e-ref: 435b549a937129b6858e7314648eb690894209fe
          service: agents_orchestrator
          include_smoke: "false"

      # Retention delays an instance's retry by design, so it runs last, against
      # the same orchestrator source redeployed with retention enabled. The
      # window must match retainedFailureWindow in the test.
      - name: Redeploy orchestrator with failed-workload retention
        env:
          FAILED_WORKLOAD_RETENTION: 90s
          FAILED_WORKLOAD_RETENTION_MAX: "1"
        run: |-
          set -euo pipefail
          devspace run deploy
          kubectl logs -n agyn-platform -l app.kubernetes.io/name=agents-orchestrator --tail=-1 |
            grep -F 'orchestrator: retaining up to 1 failed workload Pod(s) for 1m30s each'

      - name: Run failed-workload retention E2E
        uses: ./e2e/.github/actions/run-tests
        env:
          E2E_SUITES: go-core
          E2E_GO_TEST_RUN: "^TestFailedWorkloadRetentionKeepsPodAndEvidence$"
          E2E_SKIP_BUF_GENERATE: "true"
          E2E_ARTIFACT_NAME_SUFFIX: "-retention"
        with:
          e2e-ref: 435b549a937129b6858e7314648eb690894209fe
          service: agents_orchestrator
          tag: failed_workload_retention
          include_smoke: "false"

      - name: Show retention decisions
        if: ${{ !cancelled() }}
        run: |-
          kubectl logs -n agyn-platform -l app.kubernetes.io/name=agents-orchestrator --tail=-1 |
            grep -E 'retain|retention|failure evidence|failed \(WORKLOAD_FAILURE_REASON' || true

      - name: Print runtime diagnostics on failure
        if: failure()
        run: |-
          set +e
          echo "== runners DevSpace log =="
          for app in runners agents-orchestrator k8s-runner agents authorization identity threads expose gateway llm-proxy; do
            selector="app.kubernetes.io/name=${app}"
            echo "== ${app} deployment =="
            kubectl get deployment "${app}" -n agyn-platform -o yaml || kubectl get deployment "${app}-${app}" -n agyn-platform -o yaml || true
            echo "== ${app} pods =="
            kubectl get pods -n agyn-platform -l "${selector}" -o wide || true
            echo "== ${app} describe =="
            kubectl describe pods -n agyn-platform -l "${selector}" || true
            echo "== ${app} logs =="
            kubectl logs -n agyn-platform -l "${selector}" --all-containers --tail=300 || true
          done
          echo "== platform events =="
          kubectl get events -n agyn-platform --sort-by=.metadata.creationTimestamp || true
          echo "== workload pods =="
          kubectl get pods -n agyn-workloads -o wide || true
          kubectl describe pods -n agyn-workloads || true
          # Removed workloads leave only events: scheduling, OOM and pull
          # history of every attempt, and the node's committed requests.
          echo "== workload events =="
          kubectl get events -n agyn-workloads --sort-by=.lastTimestamp || true
          echo "== node allocation =="
          kubectl describe nodes || true
          echo "== workload logs =="
          for pod in $(kubectl get pods -n agyn-workloads -o name 2>/dev/null || true); do
            echo "== ${pod} current logs =="
            kubectl logs -n agyn-workloads "${pod}" --all-containers --tail=500 --prefix=true || true
          done
          echo "== workload previous logs =="
          for pod in $(kubectl get pods -n agyn-workloads -o name 2>/dev/null || true); do
            echo "== ${pod} previous logs =="
            kubectl logs -n agyn-workloads "${pod}" --all-containers --previous --tail=500 --prefix=true || true
          done

      # Evidence for the orchestrator's idle collection of the workloads it
      # starts; the final Ziti snapshot below lists identities after this wait.
      # It follows the failure dump, which must describe failing workloads
      # before idle collection can remove them during this wait.
      - name: Report orchestrator workload cleanup
        if: ${{ always() && steps.orchestrator_deploy.outcome == 'success' }}
        run: python3 .github/e2e/report-workload-cleanup.py

      - name: Collect sanitized Ziti diagnostics
        if: always()
        run: bash .github/e2e/collect-ziti-diagnostics.sh "${RUNNER_TEMP}/ziti-diagnostics/final"

      - name: Upload sanitized Ziti diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ziti-diagnostics-${{ matrix.network }}
          path: ${{ runner.temp }}/ziti-diagnostics/
          if-no-files-found: warn

      # Provisioning uses a disposable Helm-owned VM, with no ArgoCD apps.
      - name: Stop disposable platform VM
        if: always()
        run: |
          if command -v agyn >/dev/null 2>&1; then
            agyn local stop
          fi
