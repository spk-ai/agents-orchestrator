version: v2beta1

vars:
  ORCHESTRATOR_NAMESPACE: agyn-platform
  DEV_IMAGE: ghcr.io/agynio/devcontainer-go:1

functions:
  egress_ca_namespace: |-
    if kubectl get secret egress-ca -n ${ORCHESTRATOR_NAMESPACE} >/dev/null 2>&1; then
      echo "${ORCHESTRATOR_NAMESPACE}"
      exit 0
    fi
    namespace="$(kubectl get certificate -A -o jsonpath='{range .items[?(@.spec.secretName=="egress-ca")]}{.metadata.namespace}{"\n"}{end}' 2>/dev/null | head -n 1)"
    if [ -z "${namespace}" ]; then
      namespace="$(kubectl get secret -A --field-selector metadata.name=egress-ca -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}' 2>/dev/null | head -n 1)"
    fi
    if [ -z "${namespace}" ]; then
      echo "ERROR: egress-ca secret namespace could not be determined" >&2
      exit 1
    fi
    echo "${namespace}"
  ensure_egress_ca_rbac: |-
    echo "Ensuring agents-orchestrator can read egress CA secret..."
    EGRESS_CA_NAMESPACE="$(egress_ca_namespace)"
    kubectl create role agents-orchestrator-egress-ca \
      -n ${EGRESS_CA_NAMESPACE} \
      --verb=get \
      --resource=secrets \
      --resource-name=egress-ca \
      --dry-run=client \
      -o yaml | kubectl apply -f -
    kubectl create rolebinding agents-orchestrator-egress-ca \
      -n ${EGRESS_CA_NAMESPACE} \
      --role=agents-orchestrator-egress-ca \
      --serviceaccount=${ORCHESTRATOR_NAMESPACE}:agents-orchestrator \
      --dry-run=client \
      -o yaml | kubectl apply -f -
  patch_deployment: |-
    echo "Patching agents-orchestrator deployment for DevSpace..."
    EGRESS_CA_NAMESPACE="$(egress_ca_namespace)"
    patch="$(cat <<'EOF'
    spec:
      strategy:
        type: Recreate
        rollingUpdate: null
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
            - name: go-cache
              emptyDir: {}
            - name: go-mod-cache
              emptyDir: {}
            # The chart's runnersCallerToken volume: Runners calls carry this
            # projected token, so the source build exercises the same path.
            - name: runners-caller-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: agyn-runners
                      expirationSeconds: 600
                      path: token
          containers:
            - name: agents-orchestrator
              image: ghcr.io/agynio/devcontainer-go:1 # keep in sync with DEV_IMAGE
              workingDir: /opt/app/data
              env:
                - name: POLL_INTERVAL
                  value: "10s"
                - name: WORKLOAD_RECONCILE_INTERVAL
                  value: "10s"
                - name: EGRESS_CA_NAMESPACE
                  value: "__EGRESS_CA_NAMESPACE__"
                - name: ZITI_SIDECAR_IMAGE
                  value: "openziti/ziti-tunnel:2.0.0-pre10"
                - name: WORKLOAD_NETWORK_MODE
                  value: "__WORKLOAD_NETWORK_MODE__"
                - name: WORKLOAD_PROXY_IMAGE
                  value: "__WORKLOAD_PROXY_IMAGE__"
                # Off unless the caller asks: the E2E enables retention only
                # for its retention test, after the default-profile suites.
                - name: FAILED_WORKLOAD_RETENTION
                  value: "__FAILED_WORKLOAD_RETENTION__"
                - name: FAILED_WORKLOAD_RETENTION_MAX
                  value: "__FAILED_WORKLOAD_RETENTION_MAX__"
                - name: ZITI_ENROLLMENT_CONTROLLER_RESOLVE_HOST
                  value: "__ZITI_ENROLLMENT_CONTROLLER_RESOLVE_HOST__"
                - name: ZITI_ENROLLMENT_CONTROLLER_PORT
                  value: "__ZITI_ENROLLMENT_CONTROLLER_PORT__"
                - name: ZITI_RUNTIME_CONTROLLER_RESOLVE_HOST
                  value: "__ZITI_RUNTIME_CONTROLLER_RESOLVE_HOST__"
                - name: ZITI_RUNTIME_CONTROLLER_PORT
                  value: "__ZITI_RUNTIME_CONTROLLER_PORT__"
                - name: AGENT_GATEWAY_ADDRESS
                  value: "gateway.agyn:443"
                - name: AGENT_TRACING_ADDRESS
                  value: "tracing.agyn:443"
                - name: AGENT_LLM_BASE_URL
                  value: "http://llm-proxy.agyn/v1"
                - name: AGYND_AGENTS_DIRECT_ADDRESS
                  value: "__AGYND_AGENTS_DIRECT_ADDRESS__"
                - name: AGYND_RUNNERS_DIRECT_ADDRESS
                  value: "__AGYND_RUNNERS_DIRECT_ADDRESS__"
                - name: GOCACHE
                  value: /tmp/go-build-cache
                - name: GOMODCACHE
                  value: /tmp/go-mod-cache
                - name: RUNNERS_TOKEN_FILE
                  value: /var/run/secrets/agyn.io/runners-token/token
              command:
                - sh
                - -c
                - |
                  set -eu
                  required_files="go.mod go.sum buf.yaml buf.lock buf.gen.yaml cmd/orchestrator/main.go internal/config/config.go internal/k8sclient/namespace.go internal/assembler/assembler.go internal/leader/lease.go internal/reconciler/reconciler.go internal/reconciler/workload_id.go internal/subscriber/subscriber.go"
                  elapsed=0
                  while :; do
                    missing_files=""
                    for required_file in $required_files; do
                      if [ ! -f "/opt/app/data/${required_file}" ]; then
                        missing_files="${missing_files} ${required_file}"
                      fi
                    done
                    if [ -z "$missing_files" ]; then
                      break
                    fi
                    sleep 1; elapsed=$((elapsed + 1))
                    [ "$elapsed" -ge 240 ] && { echo "ERROR: sync timeout waiting for:${missing_files}" >&2; exit 1; }
                  done
                  [ -s /opt/app/data/buf.gen.yaml ] || { echo "ERROR: buf.gen.yaml is empty" >&2; exit 1; }
                  [ -d /opt/app/data/.gen ] || buf generate --include-imports
                  exec go run ./cmd/orchestrator
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
                - name: go-cache
                  mountPath: /tmp/go-build-cache
                - name: go-mod-cache
                  mountPath: /tmp/go-mod-cache
                - name: runners-caller-token
                  mountPath: /var/run/secrets/agyn.io/runners-token
                  readOnly: true
              resources:
                # Requests are reservations held for the pod's whole life, but a
                # dev container only needs its build peak briefly and then idles
                # near 100Mi. Keeping them low lets several services run from
                # source on one node; the limits still allow a full build.
                requests:
                  cpu: 10m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"
    patch="${patch/__EGRESS_CA_NAMESPACE__/${EGRESS_CA_NAMESPACE}}"
    patch="${patch/__ZITI_ENROLLMENT_CONTROLLER_RESOLVE_HOST__/${ZITI_ENROLLMENT_CONTROLLER_RESOLVE_HOST:-ziti-controller-client.ziti.svc.cluster.local}}"
    patch="${patch/__ZITI_ENROLLMENT_CONTROLLER_PORT__/${ZITI_ENROLLMENT_CONTROLLER_PORT:-}}"
    patch="${patch/__ZITI_RUNTIME_CONTROLLER_RESOLVE_HOST__/${ZITI_RUNTIME_CONTROLLER_RESOLVE_HOST:-ziti-controller-client.ziti.svc.cluster.local}}"
    patch="${patch/__ZITI_RUNTIME_CONTROLLER_PORT__/${ZITI_RUNTIME_CONTROLLER_PORT:-}}"
    patch="${patch/__AGYND_AGENTS_DIRECT_ADDRESS__/${AGYND_AGENTS_DIRECT_ADDRESS:-}}"
    patch="${patch/__AGYND_RUNNERS_DIRECT_ADDRESS__/${AGYND_RUNNERS_DIRECT_ADDRESS:-}}"
    patch="${patch/__WORKLOAD_NETWORK_MODE__/${WORKLOAD_NETWORK_MODE:-tproxy}}"
    patch="${patch/__WORKLOAD_PROXY_IMAGE__/${WORKLOAD_PROXY_IMAGE:-}}"
    patch="${patch/__FAILED_WORKLOAD_RETENTION__/${FAILED_WORKLOAD_RETENTION:-0}}"
    patch="${patch/__FAILED_WORKLOAD_RETENTION_MAX__/${FAILED_WORKLOAD_RETENTION_MAX:-1}}"
    kubectl patch deployment agents-orchestrator -n ${ORCHESTRATOR_NAMESPACE} --type strategic --patch "${patch}"
  wait_for_orchestrator: |-
    echo "Waiting for orchestrator deployment to roll out..."
    if ! kubectl rollout status deployment/agents-orchestrator \
      -n ${ORCHESTRATOR_NAMESPACE} --timeout=240s; then
      echo "ERROR: orchestrator deployment rollout failed" >&2
      kubectl get deployment agents-orchestrator -n ${ORCHESTRATOR_NAMESPACE} -o yaml >&2 || true
      kubectl get replicasets -n ${ORCHESTRATOR_NAMESPACE} \
        -l app.kubernetes.io/name=agents-orchestrator \
        -o wide >&2 || true
      kubectl get pods -n ${ORCHESTRATOR_NAMESPACE} \
        -l app.kubernetes.io/name=agents-orchestrator \
        -o wide >&2 || true
      kubectl describe pods -n ${ORCHESTRATOR_NAMESPACE} \
        -l app.kubernetes.io/name=agents-orchestrator >&2 || true
      kubectl get events -n ${ORCHESTRATOR_NAMESPACE} \
        --sort-by=.metadata.creationTimestamp >&2 || true
      exit 1
    fi

    echo "Waiting for orchestrator source sync and process start..."
    ELAPSED=0
    LABEL_SELECTOR="app.kubernetes.io/name=agents-orchestrator"
    # The whole log, drained so kubectl never sees SIGPIPE: Ziti SDK retries
    # while the router lags a new identity can bury the line under any tail.
    until kubectl logs -n ${ORCHESTRATOR_NAMESPACE} -l "${LABEL_SELECTOR}" --tail=-1 2>/dev/null | \
      awk '/orchestrator: ready/ { found = 1 } END { exit !found }'; do
      sleep 5
      ELAPSED=$((ELAPSED + 5))
      if [ "$ELAPSED" -ge 1200 ]; then
        echo "ERROR: orchestrator ready log not found within 1200s" >&2
        echo "Diagnostic pod list:" >&2
        kubectl get pods -n ${ORCHESTRATOR_NAMESPACE} -l "${LABEL_SELECTOR}" -o wide >&2 || true
        echo "Diagnostic pod describe:" >&2
        kubectl describe pods -n ${ORCHESTRATOR_NAMESPACE} -l "${LABEL_SELECTOR}" >&2 || true
        echo "Diagnostic events:" >&2
        kubectl get events -n ${ORCHESTRATOR_NAMESPACE} --sort-by=.metadata.creationTimestamp >&2 || true
        echo "Diagnostic logs (tail 200):" >&2
        kubectl logs -n ${ORCHESTRATOR_NAMESPACE} -l "${LABEL_SELECTOR}" --tail=200 >&2 || true
        exit 1
      fi
      echo "  still waiting... (${ELAPSED}s)"
    done
    echo "Orchestrator is running from source."

commands:
  deploy: |-
    devspace run-pipeline deploy -n ${DEVSPACE_NAMESPACE} $@

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      ensure_egress_ca_rbac
      patch_deployment
      if [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace agents-orchestrator
      else
        start_dev --disable-pod-replace agents-orchestrator
        sleep 10
        echo "Dev environment ready. Stopping dev session."
        stop_dev agents-orchestrator
      fi

  deploy:
    run: |-
      ensure_egress_ca_rbac
      patch_deployment
      if ! start_dev --disable-pod-replace agents-orchestrator-deploy; then
        echo "DevSpace deploy sync session exited non-zero; verifying orchestrator readiness before failing."
      fi
      wait_for_orchestrator
      echo "Deploy complete. Orchestrator is running from source."


dev:
  # CI counterpart: agents-orchestrator-deploy (one-shot sync)
  agents-orchestrator:
    namespace: ${ORCHESTRATOR_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: agents-orchestrator
    containers:
      agents-orchestrator:
        container: agents-orchestrator
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
              - /.e2e-deps/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
              - /.e2e-deps/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
              - /.e2e-deps/
        logs:
          enabled: true
          lastLines: 200

  # One-shot variant of agents-orchestrator for CI deploy pipeline. Keep sync excludePaths in sync.
  agents-orchestrator-deploy:
    namespace: ${ORCHESTRATOR_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: agents-orchestrator
    containers:
      agents-orchestrator:
        container: agents-orchestrator
        sync:
          - path: ./:/opt/app/data
            noWatch: true
            excludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
              - /.e2e-deps/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
              - /.e2e-deps/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
              - /.e2e-deps/
