nameOverride: ""
fullnameOverride: "agents-orchestrator"

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: ""
  repository: ghcr.io/agynio/agents-orchestrator
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 2
revisionHistoryLimit: 10
updateStrategy: {}

deploymentAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

automountServiceAccountToken: true

rbac:
  create: true
  clusterWide: false
  rules:
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "create", "update"]

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: false
  fsGroup: null

securityContext:
  enabled: true
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
terminationGracePeriodSeconds: null

service:
  enabled: false
  type: ClusterIP
  annotations: {}
  labels: {}
  ports: []

containerPorts: []

command: []
args: []
env:
  # The identity this service acts as when it calls a platform service that
  # authorizes its caller. Internal plumbing, not an installation choice: it is
  # a constant the platform provisions itself with, and Identity registers it
  # and grants it cluster admin from the same value. Defaulted here so the
  # service runs out of the box; override only if the platform's admin identity
  # was installed under a different id.
  - name: PLATFORM_IDENTITY_ID
    value: "a3c1e9d2-7f4b-5e1a-9c3d-2b8f6a4e7d10"
  - name: THREADS_ADDRESS
    value: "threads:50051"
  - name: NOTIFICATIONS_ADDRESS
    value: "notifications:50051"
  - name: AGENTS_ADDRESS
    value: "agents:50051"
  - name: SECRETS_ADDRESS
    value: "secrets:50051"
  - name: RUNNERS_ADDRESS
    value: "runners:50051"
  - name: IMAGES_ADDRESS
    value: "images:50051"
  - name: ORGANIZATIONS_ADDRESS
    value: "organizations:50051"
  - name: IMAGE_PROXY_ADDRESS
    value: "image-proxy:50051"
  # Derived from the one domain an installation declares. The Image Proxy is
  # the only path a workload's images are pulled by, so leaving this empty
  # disables every catalog image reference rather than falling back to one.
  - name: IMAGE_PROXY_HOST
    # Empty rather than "registry." when no domain is configured: the chart is
    # linted and installed standalone, where global carries no ingress.
    value: "{{ with .Values.global }}{{ with .ingress }}{{ with .baseDomain }}registry.{{ . }}{{ end }}{{ end }}{{ end }}"
  # In-cluster name, like every other service address above it. Empty meant each
  # installation restated the one value it could ever be.
  - name: METERING_SERVICE_ADDRESS
    value: "metering:50051"
  - name: METERING_SAMPLE_INTERVAL
    value: "60s"
  # On: an agent workload reaches the Gateway only over the overlay, and with
  # this off the orchestrator builds no ziti-management client, so createIdentity
  # returns nil and the workload dies on "produced zero addresses". Every install
  # that ships the overlay wants it, so it is the default rather than something
  # each one repeats.
  - name: ZITI_ENABLED
    value: "true"
  - name: ZITI_LEASE_RENEWAL_INTERVAL
    value: "2m"
  - name: ZITI_ENROLLMENT_TIMEOUT
    value: "2m"
  # Must track the controller and router the platform runs, which bundle-vm
  # pins at 2.0.0-pre10. A tunnel two pre-releases behind them disagrees over
  # multi-underlay: the SDK dials a second underlay, the router answers
  # "already established", the channel closes, and circuits opened on it are
  # orphaned -- the router then drops their data as an unknown conn id and the
  # workload's first LLM stream dies mid-flight.
  - name: ZITI_SIDECAR_IMAGE
    value: "openziti/ziti-tunnel:2.0.0-pre10"
  # Task Pod networking is not listed here, so extraEnvVars sets it without a
  # duplicate entry. WORKLOAD_NETWORK_MODE defaults to "tproxy" (the NET_ADMIN
  # tunneler above, which restricted Pod Security refuses). "explicit-proxy"
  # runs k8s-runner's unprivileged workload-proxy instead and requires
  # ZITI_ENABLED=true, an http:// AGENT_LLM_BASE_URL, a runner with
  # WORKLOAD_POD_SECURITY=restricted, and WORKLOAD_PROXY_IMAGE (a k8s-runner
  # image digest; WORKLOAD_PROXY_ENTRYPOINT defaults to /app/workload-proxy).
  # The workload then reaches the gateway, llm-proxy and tracing through fixed
  # loopback forwards (127.0.0.1:18443/18081/18444) and everything else through
  # HTTP(S)_PROXY=http://127.0.0.1:18080; unknown destinations fail closed.
  # The ZITI_*_RESOLVE_HOST/PORT and DNS upstream settings below are tproxy-only.
  - name: ZITI_MANAGEMENT_ADDRESS
    value: "ziti-management:50051"
  # Users, apps and agents group-sync against this service; with it off,
  # create-user and create-agent block about thirty seconds on a downstream
  # timeout, so the working configuration is the default one.
  - name: GROUP_SYNC_ENABLED
    value: "true"
  - name: GROUPS_ADDRESS
    value: "groups:50051"
  - name: NATS_URL
    value: "nats://nats:4222"
  # Upstream DNS resolver used by the workload Ziti tunnel after enrollment.
  - name: WORKLOAD_DNS_UPSTREAM
    value: ""
  # Bootstrap resolver used before the workload Ziti tunnel is running.
  - name: ZITI_ENROLLMENT_DNS_UPSTREAM
    value: ""
  # Cluster DNS name that ziti.agyn.dev should resolve to during enrollment.
  - name: ZITI_ENROLLMENT_CONTROLLER_RESOLVE_HOST
    value: "ziti-controller-client.ziti.svc.cluster.local"
  # Empty takes the port the enrollment JWT advertises. Set only where the
  # in-cluster port differs from it.
  - name: ZITI_ENROLLMENT_CONTROLLER_PORT
    value: ""
  # Cluster DNS name that ziti.agyn.dev should resolve to for sidecar auth.
  - name: ZITI_RUNTIME_CONTROLLER_RESOLVE_HOST
    value: "ziti-controller-client.ziti.svc.cluster.local"
  # Empty for the same reason as the enrollment port above.
  - name: ZITI_RUNTIME_CONTROLLER_PORT
    value: ""
  # Deprecated: use WORKLOAD_DNS_UPSTREAM instead.
  - name: CLUSTER_DNS
    value: ""
  # Leave workload-facing addresses empty so config.go selects coherent
  # Ziti service names when ZITI_ENABLED=true and cluster names otherwise.
  - name: AGENT_GATEWAY_ADDRESS
    value: ""
  - name: AGENT_TRACING_ADDRESS
    value: ""
  - name: AGYND_AGENTS_DIRECT_ADDRESS
    value: ""
  - name: AGYND_RUNNERS_DIRECT_ADDRESS
    value: ""
  - name: AGYND_CLI_INIT_IMAGE
    value: "ghcr.io/agynio/agynd-cli-init:0.24.2"
  - name: AGYN_CLI_INIT_IMAGE
    value: "ghcr.io/agynio/agyn-cli-init:0.18.1"
  - name: SANDBOX_WORKSPACE_SIZE_GB
    value: "10"
  - name: POLL_INTERVAL
    value: "5s"
  - name: IDLE_TIMEOUT
    value: "30s"
  - name: STOP_TIMEOUT_SEC
    value: ""
  # Keep a failed agent workload's Pod for investigation (Go duration, at most
  # 24h; "0" removes it at once). A retained Pod keeps its capacity slot and its
  # agent instance is not restarted until it is removed. Evidence (final
  # container statuses and redacted output tails) is stored on the workload
  # record either way; 0 bytes records statuses only. See
  # FAILED-WORKLOAD-RETENTION.md.
  - name: FAILED_WORKLOAD_RETENTION
    value: "0"
  - name: FAILED_WORKLOAD_RETENTION_MAX
    value: "1"
  - name: FAILED_WORKLOAD_EVIDENCE_LOG_BYTES
    value: "65536"
  - name: LEASE_NAME
    value: ""
  # The CA lives beside this service, so the release namespace is the answer in
  # every install. service-base templates env values, so it is derived rather
  # than named by each one -- a literal here silently reads the wrong namespace
  # when the release moves.
  - name: EGRESS_CA_NAMESPACE
    value: "{{ .Release.Namespace }}"
# Projected ServiceAccount token attached to Runners calls only (metadata
# x-agyn-caller-token). Runners validates it with a TokenReview against this
# audience and authorizes the agents-orchestrator ServiceAccount. Kubelet
# rotates it; the orchestrator re-reads it when the file changes.
runnersCallerToken:
  enabled: true
  audience: agyn-runners
  expirationSeconds: 600
  mountPath: /var/run/secrets/agyn.io/runners-token

envFrom: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

configMounts: []
extraVolumeMounts: []
extraVolumes: []

initContainers: []
extraContainers: []

lifecycle: {}

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

startupProbe:
  enabled: false

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  tls: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
    endpoints: []

egressCA:
  namespace: ""
  secretName: egress-ca
  rbac:
    create: true
